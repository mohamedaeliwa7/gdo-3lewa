const W=window;
W.go=t=>{tab=t;$('app').className='an';render();scrollTo(0,0);setTimeout(()=>$('app').className='',700)};
W.setNf=v=>{nf=v;render()};W.setNd=v=>{nd=v;render()};W.setNp=v=>{ndp=v;render()};W.setM=v=>{selM=v;render()};
W.login=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){alert('خطأ في الدخول: '+e.code)}};
W.out=()=>{signOut(auth)};
W.pv=()=>{
  const x=calc(read());
  $('pr').innerHTML=row('الدخل',f(x.inc))+row('مصاريف الشغل','- '+f(x.ex))+row('الصافي',f(x.net))+row('الثابتات','- '+f(x.fx))+row('الباقي للتوزيع',f(x.rest))+row('الكلية',f(x.kol))+row('الترفيه',f(x.fun))+row('الأمان',f(x.safe))+row('الادخار',f(x.save));
};
W.saveDay=()=>{const v=read(),dt=cdt||td();D.days[dt]={...v,...calc(v)};cdt='';put();go('home')};
W.addSp=()=>{const a=+$('sa').value;if(!a)return;D.sp.push({w:$('sw').value,a,n:$('sn').value,d:td()});put();render()};
W.delFx=i=>{D.fx.splice(i,1);put();render()};
W.addBlk=()=>{const nm=$('bn').value.trim(),s=$('bs').value,e=$('be').value,once=$('br').value=='1',dt=$('bdt').value;
  if(!nm||!s||!e||hm(e)<=hm(s)||(once&&!dt)){alert('اكتب الاسم والوقت صح، ولو مرة واحدة اختار التاريخ');return}
  const wd=once?new Date(dt+'T12:00:00').getDay():+$('bd').value;
  const b={id:eb!=null?D.sch[eb].id:Date.now(),d:wd,n:nm,s,e,k:$('bk').value,pl:$('bp').value.trim(),dr:$('bo').value.trim(),nn:$('bt').value.trim(),...(once?{dt}:{})};
  const c=D.sch.find((x,i)=>i!=eb&&(once?(x.dt?x.dt==dt:x.d==wd):(!x.dt&&x.d==wd))&&hm(x.s)<hm(e)&&hm(s)<hm(x.e));
  if(c&&!confirm('بيتداخل مع '+c.n+'، تكمل؟'))return;
  if(eb!=null)D.sch[eb]=b;else D.sch.push(b);eb=null;put();render()};
W.edBlk=i=>{eb=i;render();if(i!=null)$('bf').scrollIntoView()};
W.setCd=v=>{cdt=v==td()?'':v;render()};
W.addFx=()=>{const nm=$('fn').value.trim(),a=+$('fa').value,l=$('fl').value,d=$('ft').value=='d';if(!nm||!a)return;
  if(d&&!l){alert('اختار الديدلاين');return}
  D.fx.push(d?{n:nm,rem:a,tot:a,dl:l}:{n:nm,amt:a});put();render()};
W.payFx=i=>{const v=+prompt('سددت كام؟');if(!v)return;D.fx[i].rem=Math.max(0,D.fx[i].rem-v);put();render()};
W.tg=i=>{const d=td(),s=hst({i},d),a=D.hd[d]||(D.hd[d]=[]),b=D.hn[d]||(D.hn[d]=[]);[a,b].forEach(x=>{const k=x.indexOf(i);if(k>=0)x.splice(k,1)});if(s==0)a.push(i);if(s==1)b.push(i);put();render()};
W.skBlk=(d,id)=>{const a=D.sk[d]||(D.sk[d]=[]),k=a.indexOf(id);k<0?a.push(id):a.splice(k,1);put();render()};
W.setWo=v=>{wo=v==0?0:wo+v;render()};
W.delBlk=i=>{D.sch.splice(i,1);eb=null;put();render()};
W.addHb=()=>{const nm=$('hn').value.trim();if(!nm)return;D.hb.push({i:Date.now(),n:nm});put();render()};
W.dh=i=>{D.hb=D.hb.filter(h=>h.i!=i);put();render()};
W.addNt=()=>{
  const x=$('nx').value.trim(),k=$('nk').value,w=$('nw').value;if(!x)return;
  let d=w=='today'?addD(0):w=='tom'?addD(1):w=='pick'?$('nda').value:'';
  if(!d&&k=='عاجل')d=addD(1);
  D.nt.push({id:Date.now(),x,k,d,tm:$('ntm').value,ok:0});put();render();
};
W.okNt=i=>{D.nt[i].ok=D.nt[i].ok?0:1;put();render()};
W.delNt=i=>{D.nt.splice(i,1);put();render()};
W.saveSet=()=>{
  const v={};['price','goal','wd','kol','fun','safe','save'].forEach(x=>v[x]=+$(x).value||0);
  if(v.kol+v.fun+v.safe+v.save!=100){alert('مجموع النسب لازم يبقى 100');return}
  v.wd=Math.max(v.wd,1);D.s=v;put();go('home');
};
W.addSn=()=>{const w=$('ww').value,c=$('wc').value;if(w==='')return;D.wl.sn.push({d:td(),w:+w,c:c===''?null:+c});put();render()};
W.saveF=()=>{D.wl.f=+$('wf').value||0;put();render()};
W.payOut=()=>{const g=+$('pg').value,w=+$('pw').value;if(!g)return;const nx=pays()[0],n1=wlNow();D.wl.po.push({d:nx?nx.p:td(),g,w,v:g-w,on:td()});D.wl.sn.push({d:td(),w:Math.max((n1?n1.w:0)-w,0),c:null});put();render()};
W.lg=id=>{D.nu.log.push({d:td(),id,q:1});put();render()};
W.lq=(i,v)=>{const x=D.nu.log[i];x.q+=v;if(x.q<=0)D.nu.log.splice(i,1);put();render()};
W.addFood=()=>{const n=$('n_n').value.trim();if(!n)return;const g=i=>+$(i).value||0;D.nu.lib.push({id:uid(),n,k:g('n_k'),p:g('n_p'),c:g('n_c'),f:g('n_f'),s:$('n_s').value,pr:g('n_pr')});put();render()};
W.addGr=()=>{const a=+$('n_g').value;if(!a)return;D.nu.gr.push({d:td(),a});put();render()};
W.saveNut=()=>{const g=i=>+$(i).value||0;D.nu.bud=g('t_b');D.nu.tg={k:g('t_k'),p:g('t_p'),c:g('t_c'),f:g('t_f')};put();render()};
W.gBuild=()=>{const n=+$('g_n').value;D.gy.days=n;D.gy.plan=SPLIT[n].map((name,i)=>({id:Date.now()+i,name,wd:WD0[i],ex:[]}));put();render()};
W.gWd=(id,v)=>{D.gy.plan.find(p=>p.id==id).wd=+v;put();render()};
W.gStart=id=>{gs=id;render();scrollTo(0,0)};
W.gAdd=()=>{const n=$('g_e').value.trim(),p=D.gy.plan.find(x=>x.id==$('g_d').value);if(!n||!p)return;p.ex.push({id:uid(),n,eq:$('g_q').value,pos:$('g_p').value});put();render()};
W.gDel=(id,i)=>{D.gy.plan.find(p=>p.id==id).ex.splice(i,1);put();render()};
W.gReset=()=>{if(confirm('هيتمسح التوزيع الحالي والسجل هيفضل. تكمل؟')){D.gy.days=0;D.gy.plan=[];put();render()}};
W.addSet=id=>{const w=+$('gw'+id).value,r=+$('gr'+id).value;if(!r)return;const pr=gPR(id);D.gy.log.push({d:td(),ex:id,w,r});if(pr&&(w>pr.w||(w==pr.w&&r>pr.r)))toast('رقم قياسي جديد!');put();render()};
const shown=new Set();
setInterval(()=>{
  if(!ref)return;
  dueN().forEach(x=>{if(!shown.has(x.id)){shown.add(x.id);if(W.Notification&&Notification.permission=='granted')new Notification('تذكير',{body:x.x})}});
  if(tab=='home'&&dueN().length!=ld&&!/INPUT|SELECT/.test(document.activeElement.tagName)){ld=dueN().length;render()}
},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
W.inst=()=>ip?ip.prompt():alert('من قايمة المتصفح اختار: إضافة إلى الشاشة الرئيسية');
render();
</script>
</body>
</html>
